# Catch-all for requests that name no site we host (e.g. by IP). Serves only Let's Encrypt
# HTTP-01 challenges (also when they are forwarded here by another host) and drops the rest.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / { return 444; }
}
