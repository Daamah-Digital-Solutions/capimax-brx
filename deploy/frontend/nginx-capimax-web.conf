# Capimax BRX frontend (React SPA) — www.capimaxbrx.com, built by
# /usr/local/sbin/capimax-deploy-frontend.sh into /var/www/capimax-brx/current.
server {
    listen 80;
    listen [::]:80;
    server_name capimaxbrx.com www.capimaxbrx.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / { return 301 https://www.capimaxbrx.com$request_uri; }
}
# HTTPS for the Capimax BRX frontend. www is canonical; the apex redirects to it.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name capimaxbrx.com;
    ssl_certificate /etc/letsencrypt/live/capimaxbrx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capimaxbrx.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://www.capimaxbrx.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.capimaxbrx.com;
    ssl_certificate /etc/letsencrypt/live/capimaxbrx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capimaxbrx.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/capimax-brx/current;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Hashed build assets never change → cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # The app shell and the PWA service worker must always be revalidated, so a deploy is
    # picked up on the next visit.
    location = /index.html { add_header Cache-Control "no-cache" always; }
    location = /sw.js { add_header Cache-Control "no-cache" always; }
    location = /registerSW.js { add_header Cache-Control "no-cache" always; }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # Single-page app: every route is served by index.html (React Router handles it).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
